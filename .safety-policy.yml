# Safety policy file referenced explicitly by `tox -e safety` via
# `--policy-file .safety-policy.yml`. safety 3.x errors when
# neither a policy file nor an API key is configured.
#
# Add IDs under `ignore-vulnerabilities` with a `reason:` if a
# scan flags something we've consciously accepted. Empty for now —
# the prior `tox -e safety` invocation passed no `-i` flags either,
# so there are no legacy carryovers to port.
security:
  ignore-vulnerabilities: {}
  continue-on-vulnerability-error: False
