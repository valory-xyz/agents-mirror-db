[tox]
envlist = black-check, isort-check, flake8, mypy, pylint, bandit, safety
skip_missing_interpreters = true
skipsdist = true

[testenv]
deps =
    tomte[tox]==0.6.1

[testenv:black-check]
deps =
    tomte[black]==0.6.1
commands = black --check app/ scripts/ tests/

[testenv:black]
deps =
    tomte[black]==0.6.1
commands = black app/ scripts/ tests/

[testenv:isort-check]
deps =
    tomte[isort]==0.6.1
commands = isort --check-only --diff app/ scripts/ tests/

[testenv:isort]
deps =
    tomte[isort]==0.6.1
commands = isort app/ scripts/ tests/

[testenv:flake8]
deps =
    tomte[flake8]==0.6.1
commands = flake8 app/ scripts/ tests/

[testenv:mypy]
deps =
    tomte[mypy]==0.6.1
commands = mypy app/ scripts/ tests/ --config-file tox.ini --ignore-missing-imports --disable-error-code=import-untyped

[testenv:pylint]
deps =
    tomte[pylint]==0.6.1
    {[testenv]deps}
commands = pylint app/ scripts/ tests/ --disable=C0114,C0115,C0116,E0401,R0903,R0801,R0913,R0917,W1309,W0707,W0621,W1203,R1705,W0612,W0613,C0103,C0301,C0302

[testenv:bandit]
deps =
    tomte[bandit]==0.6.1
commands = bandit -r app/ -s B101

[testenv:safety]
deps =
    tomte[safety]==0.6.1
commands = safety check

[testenv:py{3.10,3.11,3.12,3.13,3.14}-{linux,win,darwin}]
platform =
    linux: ^linux$
    win: ^win32$
    darwin: ^darwin$
deps =
    pytest>=8.0.0,<9.0.0
    httpx>=0.27.0
    anyio[trio]>=4.0.0
    pytest-anyio
    fastapi==0.115.6
    uvicorn==0.34.0
    sqlalchemy==2.0.36
    psycopg2-binary>=2.9.10,<3
    pydantic>=2.11.9,<3
    pydantic-settings>=2.7.1,<3
    python-dotenv==1.0.1
    requests
    eth-account
commands = pytest tests/

[flake8]
max-line-length = 88
extend-ignore = E203,E501,W503,B008,D1

[isort]
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
line_length = 88
lines_after_imports = -1
profile = black

[mypy]
python_version = 3.10
ignore_missing_imports = True
disallow_any_unimported = False
