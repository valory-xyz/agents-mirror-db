; Local extensions to tomte's canonical tox.ini. Consumed by `tomte tox`.

[tomte-extensions]
tomte_defaults = true
; Pylint suppressions specific to this repo. Carried over from the
; pre-wrapper tox.ini; revisit if any become unused.
extra_pylint_disables = C0114,C0115,C0116,E0401,R0903,R0801,R0913,R0917,W1309,W0707,W0621,W1203,R1705,W0612,W0613,C0103,C0301,C0302

; Per-repo mypy overlay. Tomte's `[testenv:mypy]` uses `skip_install` and
; only installs `tomte[mypy]` (version pinned in pyproject.toml), so our
; runtime deps (fastapi, sqlalchemy, pydantic, starlette, eth_account, ...)
; aren't importable during type-check. Flip `ignore_missing_imports` on
; globally so mypy treats unresolved imports as untyped instead of fatal.
;
; Accepted breadth: a typo'd import like `from sqlalchmy import X` will
; also pass mypy silently — there's no narrower per-module fix because
; the problem is every runtime dep being absent, not one library. Type
; checks still run against our own code.

[mypy]
ignore_missing_imports = True
