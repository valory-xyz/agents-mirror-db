[project]
name = "agents-fun-mirror-db"
version = "0.1.0"
description = "FastAPI app for managing agents, Twitter accounts, tweets, and interactions"
authors = [{ name = "Valory AG" }]
requires-python = ">=3.10,<3.15"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "sqlalchemy==2.0.36",
    "psycopg2-binary>=2.9.10,<3",
    "pydantic>=2.11.9,<3",
    "pydantic-settings>=2.7.1,<3",
    "python-dotenv==1.0.1",
    "requests",
    "eth-account",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "httpx>=0.27.0",
    "anyio[trio]>=4.0.0",
    "pytest-anyio",
    "tox>=4.0.0",
    "tox-uv",
]

[tool.uv]
package = false

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
