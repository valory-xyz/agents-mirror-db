[tool.poetry]
name = "agents-fun-mirror-db"
version = "0.1.0"
description = "FastAPI app for managing agents, Twitter accounts, tweets, and interactions"
authors = ["Valory AG"]
license = "Apache-2.0"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
fastapi = "==0.115.6"
uvicorn = "==0.34.0"
sqlalchemy = "==2.0.36"
psycopg2-binary = "==2.9.10"
pydantic = ">=2.11.9,<3"
pydantic-settings = ">=2.7.1,<3"
python-dotenv = "==1.0.1"
requests = "*"
eth-account = "*"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<9.0.0"
httpx = ">=0.27.0"
anyio = {version = ">=4.0.0", extras = ["trio"]}
pytest-anyio = "*"
tox = ">=4.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
