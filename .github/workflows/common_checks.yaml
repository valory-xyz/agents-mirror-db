name: Common Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lock_check:
    name: uv lock check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.15"
      - name: Check uv lock
        run: uv lock --check

  docker_build:
    name: Docker build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build image (no push)
        run: docker build -t agents-mirror-db:pr-${{ github.event.pull_request.number || github.sha }} .

  linter_checks:
    name: Linter checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install tomte
        run: pip install 'tomte[cli, tests]==0.7.0' tox-uv
      - name: Code checks
        run: tomte tox -p -e black-check -e isort-check -e flake8 -e mypy -e pylint
      - name: Security checks
        run: tomte tox -p -e bandit -e safety

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    needs: [lock_check, linter_checks]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.15"
      - name: Install project dependencies
        # `--no-default-groups --group test` installs runtime + test
        # deps only (pytest, httpx, anyio[trio], pytest-anyio). The
        # `dev` group adds the tomte/tox-uv lint toolchain which the
        # test matrix doesn't need — keeping it out shrinks the
        # per-cell install across 15 (3 OS x 5 Python) cells.
        #
        # Pin uv's interpreter to the matrix Python so a different
        # `>=3.10,<3.15`-compatible Python on PATH can't silently
        # collapse the cross-version matrix to a single interpreter.
        run: uv sync --no-default-groups --group test --frozen --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest tests/

  all_checks_passed:
    name: All checks passed
    needs: [lock_check, docker_build, linter_checks, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required checks
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "A required dependency failed or was cancelled"
            exit 1
          fi
