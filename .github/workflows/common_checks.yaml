name: Common Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lock_check:
    name: uv lock check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.15"
      - name: Check uv lock
        run: uv lock --check

  docker_build:
    name: Docker build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build image (no push)
        run: docker build -t agents-mirror-db:pr-${{ github.event.pull_request.number || github.sha }} .

  linter_checks:
    name: Linter checks
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        tox-env:
          - black-check
          - isort-check
          - flake8
          - mypy
          - pylint
          - bandit
          - safety
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tox via tomte (+ tox-uv for fast venv creation)
        run: pip install tomte[tox,cli]==0.6.1 tox-uv
      - name: Run ${{ matrix.tox-env }}
        run: tox -e ${{ matrix.tox-env }}

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    needs: [lock_check, linter_checks]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tox + tox-uv
        run: pip install tox tox-uv
      - if: matrix.os == 'ubuntu-24.04'
        name: Run tests (Linux)
        run: tox -e py${{ matrix.python-version }}-linux
      - if: matrix.os == 'macos-15'
        name: Run tests (macOS)
        run: tox -e py${{ matrix.python-version }}-darwin
      - if: matrix.os == 'windows-2025'
        name: Run tests (Windows)
        run: tox -e py${{ matrix.python-version }}-win

  all_checks_passed:
    name: All checks passed
    needs: [lock_check, docker_build, linter_checks, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required checks
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "A required dependency failed or was cancelled"
            exit 1
          fi
