name: Common Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lock_check:
    name: Poetry lock check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: snok/install-poetry@v1
        with:
          version: "1.8.0"
      - name: Check poetry lock
        run: poetry lock --check
      - name: Install dependencies
        run: poetry install

  linter_checks:
    name: Linter checks
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        tox-env:
          - black-check
          - isort-check
          - flake8
          - mypy
          - pylint
          - bandit
          - safety
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tox via tomte
        run: pip install tomte[tox,cli]==0.6.1
      - name: Run ${{ matrix.tox-env }}
        run: tox -e ${{ matrix.tox-env }}

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    needs: [lock_check, linter_checks]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: pip install tox
      - if: matrix.os == 'ubuntu-24.04'
        name: Run tests (Linux)
        run: tox -e py${{ matrix.python-version }}-linux
      - if: matrix.os == 'macos-15'
        name: Run tests (macOS)
        run: tox -e py${{ matrix.python-version }}-darwin
      - if: matrix.os == 'windows-2025'
        name: Run tests (Windows)
        run: tox -e py${{ matrix.python-version }}-win
